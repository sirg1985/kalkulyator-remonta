<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Бесплатный калькулятор ремонта — примерный расчёт стоимости материалов.">
<title>Калькулятор ремонта</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}.container{max-width:900px;margin:0 auto;padding:30px 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}h1{margin:0 0 8px;font-size:34px}.sub{color:#667085;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{display:block;font-weight:600;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f8fafc;border-radius:14px;display:none}.total{font-size:30px;font-weight:800;margin:8px 0}.muted{color:#667085;font-size:14px}ul{padding-left:20px;line-height:1.8}.footer{text-align:center;color:#667085;font-size:13px;margin-top:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:28px}.card{padding:20px}}
</style></head>
<body><div class="container"><div class="card"><h1>Калькулятор ремонта</h1><div class="sub">Рассчитайте примерную стоимость материалов за несколько секунд.</div>
<div class="grid"><div><label for="area">Площадь помещения, м²</label><input id="area" type="number" min="1" value="20"></div><div><label for="type">Тип ремонта</label><select id="type"><option value="basic">Косметический</option><option value="standard" selected>Стандартный</option><option value="premium">Премиум</option></select></div><div><label for="floor">Пол, грн/м²</label><input id="floor" type="number" min="0" value="600"></div><div><label for="walls">Стены, грн/м²</label><input id="walls" type="number" min="0" value="450"></div><div><label for="ceiling">Потолок, грн/м²</label><input id="ceiling" type="number" min="0" value="300"></div><div><label for="reserve">Запас материалов, %</label><input id="reserve" type="number" min="0" max="50" value="10"></div></div>
<button type="button" onclick="calculate()">Рассчитать стоимость</button><div class="result" id="result" aria-live="polite"><div class="muted">Ориентировочная стоимость материалов</div><div class="total" id="total">0 грн</div><div class="muted">Расчёт является ориентировочным.</div><ul id="details"></ul></div></div><div class="footer">Бесплатный онлайн-калькулятор ремонта</div></div>
<script>function money(n){return Math.round(n).toLocaleString('ru-RU')+' грн'}function calculate(){const area=Math.max(0,Number(document.getElementById('area').value)||0),floor=Math.max(0,Number(document.getElementById('floor').value)||0),walls=Math.max(0,Number(document.getElementById('walls').value)||0),ceiling=Math.max(0,Number(document.getElementById('ceiling').value)||0),reserve=Math.max(0,Number(document.getElementById('reserve').value)||0),type=document.getElementById('type').value,multiplier={basic:.85,standard:1,premium:1.35}[type],floorCost=area*floor*multiplier,wallsCost=area*walls*multiplier,ceilingCost=area*ceiling*multiplier,subtotal=floorCost+wallsCost+ceilingCost,total=subtotal*(1+reserve/100);document.getElementById('total').textContent=money(total);document.getElementById('details').innerHTML='<li>Пол: '+money(floorCost)+'</li><li>Стены: '+money(wallsCost)+'</li><li>Потолок: '+money(ceilingCost)+'</li><li>Запас материалов: '+reserve+'%</li>';document.getElementById('result').style.display='block'}</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор ремонта — смета</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}.container{max-width:980px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 30px #00000014}h1{margin:0 0 8px;font-size:34px}.sub{color:#667085;margin-bottom:24px}.room{border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin-bottom:16px}.room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.room-title{font-size:20px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}button{padding:14px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#e9edf2;color:#17202a}button.remove{background:#fff0f0;color:#b42318;padding:8px 12px;font-size:14px}.result{margin-top:24px;padding:22px;background:#f8fafc;border-radius:14px;display:none}.total{font-size:32px;font-weight:800;margin:8px 0 16px}.room-result{padding:10px 0;border-top:1px solid #e4e7ec}.muted{color:#667085;font-size:14px}.footer{text-align:center;color:#667085;font-size:13px;margin-top:18px}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}h1{font-size:28px}.card{padding:18px}.room-head{align-items:flex-start}}</style></head><body><div class="container"><div class="card"><h1>Калькулятор ремонта</h1><div class="sub">Добавьте комнаты и получите примерную общую смету материалов.</div><div id="rooms"></div><div class="actions"><button type="button" onclick="addRoom()">+ Добавить комнату</button><button type="button" class="secondary" onclick="calculate()">Рассчитать смету</button></div><div class="actions"><button type="button" class="secondary" onclick="resetAll()">Сбросить</button></div><div class="result" id="result" aria-live="polite"><div class="muted">Ориентировочная общая стоимость материалов</div><div class="total" id="total">0 грн</div><div id="details"></div></div></div><div class="footer">Бесплатный онлайн-калькулятор ремонта</div></div><script>let roomId=0;function money(n){return Math.round(n).toLocaleString('ru-RU')+' грн'}function addRoom(){roomId++;const id=roomId,d=document.createElement('div');d.className='room';d.id='room-'+id;d.innerHTML=`<div class="room-head"><div class="room-title">Комната ${id}</div><button type="button" class="remove" onclick="removeRoom(${id})">Удалить</button></div><div class="grid"><div><label>Название</label><input class="name" type="text" value="Комната ${id}"></div><div><label>Площадь, м²</label><input class="area" type="number" min="1" value="20"></div><div><label>Тип ремонта</label><select class="type"><option value="basic">Косметический</option><option value="standard" selected>Стандартный</option><option value="premium">Премиум</option></select></div><div><label>Запас материалов, %</label><input class="reserve" type="number" min="0" max="50" value="10"></div><div><label>Пол, грн/м²</label><input class="floor" type="number" min="0" value="600"></div><div><label>Стены, грн/м²</label><input class="walls" type="number" min="0" value="450"></div><div><label>Потолок, грн/м²</label><input class="ceiling" type="number" min="0" value="300"></div></div>`;document.getElementById('rooms').appendChild(d)}function removeRoom(id){document.getElementById('room-'+id)?.remove()}function calculate(){let total=0,output='';document.querySelectorAll('.room').forEach((r,i)=>{let name=r.querySelector('.name').value.trim()||'Комната '+(i+1),a=+r.querySelector('.area').value||0,f=+r.querySelector('.floor').value||0,w=+r.querySelector('.walls').value||0,c=+r.querySelector('.ceiling').value||0,res=+r.querySelector('.reserve').value||0,m={basic:.85,standard:1,premium:1.35}[r.querySelector('.type').value],fc=a*f*m,wc=a*w*m,cc=a*c*m,rt=(fc+wc+cc)*(1+res/100);total+=rt;output+=`<div class="room-result"><strong>${escapeHtml(name)}</strong> — ${money(rt)}<br><span class="muted">Пол: ${money(fc)} · Стены: ${money(wc)} · Потолок: ${money(cc)} · Запас: ${res}%</span></div>`});document.getElementById('total').textContent=money(total);document.getElementById('details').innerHTML=output||'<div class="muted">Добавьте хотя бы одну комнату.</div>';document.getElementById('result').style.display='block'}function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}function resetAll(){document.getElementById('rooms').innerHTML='';document.getElementById('result').style.display='none';roomId=0;addRoom()}addRoom();</script></body></html>
